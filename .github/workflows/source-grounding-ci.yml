name: Source Grounding CI

on:
  pull_request:
    paths:
      - app.py
      - lawglance_main.py
      - source_contract.py
      - tests/**
      - README.md
      - .github/workflows/source-grounding-ci.yml
  push:
    branches: [main]
    paths:
      - app.py
      - lawglance_main.py
      - source_contract.py
      - tests/**
      - README.md
      - .github/workflows/source-grounding-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m py_compile app.py lawglance_main.py source_contract.py tests/test_source_contract.py
      - run: python -m unittest tests.test_source_contract
